name: CI

on:
  push:
  pull_request:

jobs:
  build-linux:
    name: Build + installer (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Read Qt versions
        run: grep -E '^[A-Za-z_][A-Za-z0-9_]*=' qt-versions.env >> "$GITHUB_ENV"

      - name: Install system deps
        run: >
          sudo apt-get update &&
          sudo apt-get install -y ninja-build patchelf libsecret-1-dev
          libgl1 libfontconfig1 libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true

      - name: Export QT_DIR
        run: echo "QT_DIR=$(qmake -query QT_INSTALL_PREFIX)" >> "$GITHUB_ENV"

      - name: Configure (Debug)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_DIR"
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ctest --test-dir build -N 2>/dev/null | grep -qE "Test +#[0-9]+"; then
            ctest --test-dir build --output-on-failure
          else
            echo "No tests configured; skipping."
          fi

      - name: Cache IFW
        uses: actions/cache@v5
        with:
          path: ~/Qt/Tools/QtInstallerFramework
          key: ifw-linux-4.11

      - name: Install Qt Installer Framework
        run: |
          if [ ! -x "$HOME/Qt/Tools/QtInstallerFramework/4.11/bin/binarycreator" ]; then
            python -m pip install --break-system-packages aqtinstall || python -m pip install aqtinstall
            aqt install-tool linux desktop tools_ifw --outputdir "$HOME/Qt"
          fi

      - name: Stage payload
        env:
          QT_DIR: ${{ env.QT_DIR }}
        run: bash Installer/Linux/linuxdeploy.sh

      - name: Build offline installer
        env:
          QT_DIR: ${{ env.QT_DIR }}
        run: bash Installer/Linux/make-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: googleaiviewer-linux-installer
          path: Installer/Linux/*.run
          retention-days: 90

  build-macos:
    name: Build + installer (macOS 14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt 6
        run: |
          brew install qt@6
          echo "QT_DIR=$(brew --prefix qt@6)" >> "$GITHUB_ENV"

      - name: Configure (Debug)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$QT_DIR"
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if ctest --test-dir build -N 2>/dev/null | grep -qE "Test +#[0-9]+"; then
            ctest --test-dir build --output-on-failure
          else
            echo "No tests configured; skipping."
          fi

      - name: Stage payload
        env:
          QT_DIR: ${{ env.QT_DIR }}
        run: bash Installer/MacOS/macdeploy.sh

      - name: Build DMG installer
        env:
          QT_DIR: ${{ env.QT_DIR }}
        run: bash Installer/MacOS/make-installer.sh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: googleaiviewer-macos-installer
          path: Installer/MacOS/*.dmg
          retention-days: 90

  build-windows:
    name: Build + installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Read Qt versions
        run: |
          Get-Content qt-versions.env | ForEach-Object {
            if ($_ -match '^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.+?)\s*$') {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }

      - name: Setup MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION_WINDOWS_CI }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Export QT_DIR
        run: echo "QT_DIR=$env:QT_ROOT_DIR" >> $env:GITHUB_ENV

      - name: Configure (Debug)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_PREFIX_PATH="$env:QT_DIR"
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --config Debug

      - name: Test (headless)
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_FONTDIR: C:/Windows/Fonts
        run: |
          if (ctest --test-dir build -N 2>$null | Select-String "Test +#[0-9]+") {
            ctest --test-dir build --output-on-failure
          } else {
            Write-Host "No tests configured; skipping."
          }

      - name: Cache IFW
        uses: actions/cache@v5
        with:
          path: ~/Qt/Tools/QtInstallerFramework
          key: ifw-windows-4.11

      - name: Install Qt Installer Framework
        run: |
          $bc = Get-ChildItem "$env:USERPROFILE\Qt\Tools\QtInstallerFramework\*\bin\binarycreator.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $bc) {
            python -m pip install aqtinstall
            aqt install-tool windows desktop tools_ifw --outputdir "$env:USERPROFILE\Qt"
            $bc = Get-ChildItem "$env:USERPROFILE\Qt\Tools\QtInstallerFramework\*\bin\binarycreator.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          }
          if ($bc) { echo "IFW_BIN=$($bc.DirectoryName)" >> $env:GITHUB_ENV; Write-Host "IFW: $($bc.FullName)" } else { Write-Error "binarycreator.exe not found after install"; exit 1 }

      - name: Stage payload
        env:
          QT_DIR: ${{ env.QT_DIR }}
        shell: cmd
        run: call Installer\Windows\windeploy.bat

      - name: Build offline installer
        env:
          QT_DIR: ${{ env.QT_DIR }}
          IFW_BIN: ${{ env.IFW_BIN }}
        shell: cmd
        run: call Installer\Windows\make-installer.bat

      - name: Upload installer artifact
        uses: actions/upload-artifact@v5
        with:
          name: googleaiviewer-windows-installer
          path: Installer/Windows/*-offline.exe
          retention-days: 90
